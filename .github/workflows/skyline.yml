name: Atualiza a cidade de commits

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fonttools==4.60.1
      - run: python scripts/skyline.py "$GITHUB_REPOSITORY_OWNER"
        env:
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publica o SVG se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza a cidade de commits" && git push)
